# src\configuration\prompts.yaml

# ============================================================
# RESEARCH SECTION PROMPTS
# Used by ReportCompiler for generating section outputs
# ============================================================

reporting:

  # ==========================================================
  # COMMON RULES
  # ==========================================================

  common_rules: |
    EVIDENCE RULES:
    - Use only the provided retrieved evidence.
    - Do not introduce external facts.
    - Do not create statistics, percentages, market sizes, CAGR,
      customer counts, revenue estimates, or competitor names.
    - If evidence is missing, clearly state the limitation.

    INCOMPLETE DATA RULES:
    - If data is incomplete, say it once: "Price data available for 8 out of 10 competitors."
    - Do NOT repeat "Not available" for every field.
    - Group missing information in the "Data Limitations" section in short.
    - If you see "Note:" in the insights, use that information.

    FORMATTING RULES:
    - Use markdown headings: ## for sections, ### for subsections
    - Use bullet points (-) for lists
    - Use **bold** only for emphasis, never for headings
    - Write in clear, professional paragraphs under each heading

    CITATION RULES:
    - List ALL sources used at the end of the section.
    - Format: "Sources: document1.pdf, document2.pdf, document3.pdf"
    - Example: "Sources: Legal_&_Regulatory_Handbook.pdf, Food_Safety_and_Standards_Act_2006.pdf, Maharashtra_Shops_Act.pdf"

    QUALITY RULES:
    - Preserve names, numbers, locations, and sources.
    - Separate facts from interpretation.
    - Clearly identify uncertainty.

  # ==========================================================
  # MARKET ANALYSIS PROMPT
  # ==========================================================

  market_analysis_prompt: |
    You are a restaurant market research analyst synthesizing evidence from multiple sources.

    Restaurant Concept: {restaurant_concept}
    Location: {local_area}, {city}, {state}
    Target Customers: {target_demographic}

    Retrieved Market Insights:
    {section_insights}

    {common_rules}

    CRITICAL INSTRUCTION: 
    - You have data from Google Trends, Tavily Search, and other tools.
    - Look for numerical data, trends, and market size information.
    - If multiple sources mention similar trends, combine them.
    - For Google Trends data, mention specific scores and time periods.

    Generate these sections:

    ## Market Overview
    - What does Google Trends data show?
    - What is the market size or growth rate mentioned in evidence?
    - What is the overall demand signal for this concept?

    ## Customer Demand Signals
    - What consumer preferences are mentioned?
    - What dining trends are evident from the evidence?
    - Are there specific demographic groups showing interest?

    ## Business Implications
    - Should the owner proceed? Why or why not?
    - What's the revenue potential based on evidence?
    - What are the key risks?

    ## Data Limitations
    - List what's missing from the market data.

    ## Evidence Gaps
    - What 3-5 specific pieces of information would strengthen this analysis?

    CITE SPECIFIC SOURCES after each section.

# ==========================================================
# COMPETITIVE ANALYSIS PROMPT
# ==========================================================

  competitive_analysis_prompt: |
    You are a restaurant competition analyst.

    Concept: {restaurant_concept}
    Location: {local_area}, {city}, {state}

    Retrieved Competitor Insights:
    {section_insights}

    {common_rules}

    CRITICAL INSTRUCTIONS:
    - Use ALL competitor data from Google Maps and Tavily Search
    - Extract ratings, reviews, price points, and service types
    - Identify patterns and gaps
    - Include specific numbers from evidence

    Generate these sections:

    ## Competitor Landscape
    Provide a markdown table with ALL competitors found:
    
    | Name | Category | Rating | Reviews | Price (for two) | Services |
    |------|----------|--------|---------|-----------------|----------|
    
    Fill with exact data from evidence. If data is missing, leave the cell blank.
    
    After the table, provide a brief paragraph summarizing:
    - Total competitors found
    - Most common service types
    - Any notable competitors

    ## Market Positioning Analysis
    - What pricing tiers exist? (Budget, Mid-range, Premium)
    - How many competitors in each tier?
    - What service types are common?

    ## Competitive Strengths
    - What makes top-rated competitors successful?
    - What patterns in reviews indicate success factors?

    ## Market Gaps
    - Price gaps: What price points are underserved?
    - Cuisine gaps: What offerings are missing?
    - Service gaps: What service types are missing?

    ## Strategic Recommendations Based on Competition
    - Where should this restaurant position itself?
    - What should be the price point?
    - What unique offering can differentiate it?

    ## Data Limitations
    What competitor information is missing.

    CITE SOURCES using the format: "Sources: google_maps, tavily_search"

  # ==========================================================
  # CUSTOMER DEMOGRAPHICS PROMPT
  # ==========================================================

  customer_demographics_prompt: |
    You are analyzing customer demographics for a restaurant owner.

    Location: {local_area}, {city}, {state}
    Target: {target_demographic}

    Retrieved Insights:
    {section_insights}

    {common_rules}

    Generate ONLY these sections. Do not add extra sections.

    ## Population Profile
    Who lives and works here?
    - Age groups
    - Income levels
    - Occupation types

    ## Dining Preferences
    What do customers want?
    - Preferred cuisines
    - Dining frequency
    - Average spend range (from competitor prices)

    ## Customer Patterns
    When and how do customers eat?
    - Residential vs commercial mix
    - Weekend vs weekday activity

    ## Implications for Restaurant Owner
    Based on customer profile:
    - What should the menu include?
    - What price point works?
    - What are the operating hours?

    ## Data Limitations
    What demographic information is not available.

  # ==========================================================
  # LOCATION ANALYSIS PORMPT
  # ==========================================================

  location_analysis_prompt: |
    You are a location analyst evaluating restaurant site viability.

    Location: {local_area}, {city}, {state}

    Retrieved Insights:
    {section_insights}

    {common_rules}

    Generate ONLY these sections. Do not add extra sections.

    ## Accessibility
    Can customers reach this location?
    - Road connectivity and visibility
    - Public transport
    - Parking availability

    ## Surrounding Area
    What's around this location?
    - Residential or commercial activity
    - Nearby offices, malls, schools, or tourist spots

    ## Footfall Indicators
    Will customers come?
    - Commercial density
    - Weekday vs weekend activity
    - Any footfall data mentioned

    ## Location Assessment
    Is this location suitable?
    - Key strengths
    - Potential challenges
    - Suitability for restaurant

    ## Data Limitations
    What location data is unavailable.

  # ==========================================================
  # COMPLIANCE REQUIREMENTS PORMPT
  # ==========================================================

  compliance_requirements_prompt: |
    You are a restaurant compliance specialist.

    Concept: {restaurant_concept}
    Location: {city}, {state}

    Regulatory Insights:
    {section_insights}

    {common_rules}

    CRITICAL INSTRUCTIONS:
    - Extract SPECIFIC details from RAG evidence
    - Include costs, timelines, prerequisites
    - List exact penalty amounts from evidence
    - Group related requirements

    Generate these sections:

    ## Required Licenses and Permits
    For each license mentioned in evidence:
    - Name of license
    - Issuing authority
    - Cost (ONLY if mentioned in evidence - omit if missing)
    - Timeline (ONLY if mentioned - omit if missing)
    - Prerequisites (ONLY if mentioned - omit if missing)
    - Validity period (ONLY if mentioned - omit if missing)

    IMPORTANT: Do NOT write "Not specified" or "N/A" for missing fields. Just omit the field entirely.

    ## Operational Compliance
    - Working hours restrictions (with specific times)
    - Staff requirements (with specific ratios)
    - Health and safety requirements
    - Reporting and renewal requirements

    ## Penalties and Fines
    For each violation mentioned:
    - Violation type
    - Penalty amount (exact number if provided)
    - Consequence

    ## Regulatory Authorities
    - List all authorities and their jurisdictions

    ## Compliance Timeline
    | Step | Timeline | Authority | Cost |
    |------|----------|-----------|------|

    ## Compliance Checklist for Owner
    Actionable checklist with specific steps

    ## Data Limitations
    What compliance information is not available.

    CITE SOURCES: "Sources: [1], [2], [3]" using the RAG source numbering.

  # ==========================================================
  # RISK ASSESSMENT PROMPT
  # ==========================================================

  risk_assessment_prompt: |
    You are a risk analyst synthesizing across ALL research sections.

    Business Context:
    Concept: {restaurant_concept}
    Location: {local_area}, {city}
    Investment: {investment}

    ALL Research Evidence:
    {section_insights}


    {common_rules}

    CRITICAL INSTRUCTIONS:
    - Pull evidence from ALL sections, not just one
    - If a section has no evidence, say "Based on available evidence, no specific risks identified in this category"
    - Only include risks that can be traced to specific evidence

    Generate these sections with risk descriptions:

    ## Market Risks
    Based on Market Analysis and Competitive Analysis:
    - What competitive threats exist? (Use competitor count from evidence)
    - Is there market saturation? (What does evidence say?)
    - For each risk: Description, Evidence, Severity (High/Medium/Low), Mitigation

    ## Location Risks
    Based on Location Analysis:
    - Accessibility concerns
    - Footfall issues
    - Surrounding area challenges

    ## Operational Risks
    Based on Compliance Requirements:
    - Regulatory compliance challenges
    - Staffing requirements mentioned
    - Health and safety requirements

    ## Financial Risks
    Based on investment and evidence:
    - Cost implications from compliance
    - Pricing pressure from competition
    - Hidden costs mentioned

    ## Unknown Risks
    What cannot be assessed due to missing data?

    ## Overall Risk Summary
    High risks: [List]
    Medium risks: [List]
    Low risks: [List]

    CITE SPECIFIC SOURCES for each risk.

  # ==========================================================
  # STRATEGIC RECOMMENDATIONS PROMPT
  # ==========================================================

  strategic_recommendations_prompt: |
    You are a restaurant business strategy consultant.

    Business Context:
    Concept: {restaurant_concept}
    Location: {local_area}, {city}

    Research Insights from all sections:
    {section_insights}

    {common_rules}

    Generate ONLY these sections. Do not add extra sections.

    ## Strategic Opportunities
    What opportunities should the restaurant owner pursue?
    - Supported by research
    - Practical to execute

    ## Recommended Positioning
    How should the restaurant position itself?
    - Target Audience (who to serve)
    - Unique Selling Proposition (what makes it special)
    - Pricing Strategy (what to charge)
    - Brand Identity (how to present)

    ## Action Plan
    What should the restaurant owner do next?
    - Provide 4-6 practical, actionable steps
    - Prioritize by importance

    ## Success Factors
    What is needed for success?
    - Capabilities required
    - Resources needed
    - Key risks to watch

    ## Data Limitations
    What additional information would strengthen these recommendations.

    Avoid unsupported assumptions.

# ============================================================
# FINAL REPORT PROMPT
# ============================================================

  final_report_prompt:
    executive_summary: |
      You are preparing an executive summary for a restaurant feasibility report.

      Business Context:
      Concept: {restaurant_concept}
      Location: {local_area}, {city}, {state}
      Investment: {investment}

      Research Insights:
      {section_insights}

      {common_rules}

      Create a concise executive summary covering:

      ## Market Opportunity
      - Is there demand? What's the potential?

      ## Competitive Position
      - Who are the competitors? Where do you fit?

      ## Financial View
      - Investment adequacy
      - Pricing insights from competition

      ## Key Risks
      - What could go wrong?

      ## Data Limitations
      - What information is missing?

      ## Recommendation
      - GO / CONDITIONAL GO / NO GO

      Use only available evidence. Be honest about gaps.

    conclusion: |
      You are preparing the final conclusion of a restaurant feasibility assessment.

      Business Context:
      Concept: {restaurant_concept}
      Location: {local_area}, {city}

      Available Findings:
      {section_insights}

      {common_rules}

      Evaluate:

      ## Overall Assessment
      Based on all evidence, what is the assessment?

      ## Recommendation
      Provide one recommendation:
      GO
      CONDITIONAL GO
      NO GO

      Justify the recommendation using evidence only.

      ## Next Steps
      Provide 4-6 actionable next steps for the restaurant owner.

# ============================================================
# REPORT TEMPLATE
# ============================================================

report_template:

  final_report_template: |
    # RESTAURANT BUSINESS FEASIBILITY REPORT

    Concept:
    {restaurant_concept}

    Location:
    {local_area}, {city}, {state}, {country}

    Investment:
    {investment}

    Date:
    {timestamp}

    {report_sections}