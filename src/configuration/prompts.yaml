# src\configuration\prompts.yaml

# ============================================================
# RESEARCH SECTION PROMPTS
# Used by ReportCompiler for generating section outputs
# ============================================================

reporting:

  # ==========================================================
  # COMMON RULES
  # ==========================================================

  common_rules: |
    EVIDENCE RULES:
    - Use only the provided retrieved evidence.
    - Do not introduce external facts.
    - Do not create statistics, percentages, market sizes, CAGR,
      customer counts, revenue estimates, or competitor names.
    - If evidence is missing, clearly state the limitation.

    INCOMPLETE DATA RULES:
    - If data is incomplete, say it once: "Price data available for 8 out of 10 competitors."
    - Do NOT repeat "Not available" for every field.
    - Group missing information in the "Data Limitations" section.
    - If you see "Note:" in the insights, use that information.

    FORMATTING RULES:
    - Use markdown headings: ## for sections, ### for subsections
    - Use bullet points (-) for lists
    - Use **bold** only for emphasis, never for headings
    - Write in clear, professional paragraphs under each heading

    CITATION RULES:
    - List ALL sources used at the end of the section.
    - Format: "Sources: document1.pdf, document2.pdf, document3.pdf"
    - Example: "Sources: Legal_&_Regulatory_Handbook.pdf, Food_Safety_and_Standards_Act_2006.pdf, Maharashtra_Shops_Act.pdf"

    QUALITY RULES:
    - Preserve names, numbers, locations, and sources.
    - Separate facts from interpretation.
    - Clearly identify uncertainty.

  # ==========================================================
  # MARKET ANALYSIS PROMPT
  # ==========================================================

  market_analysis_prompt: |
    You are a restaurant market research analyst.

    Restaurant Concept: {restaurant_concept}
    Location: {local_area}, {city}, {state}
    Target Customers: {target_demographic}

    Retrieved Market Insights:
    {section_insights}

    {common_rules}

    Generate ONLY these sections. Do not add extra sections.

    ## Market Overview
    Summarize what the market signals indicate:
    - Is there demand for this concept?
    - What is the overall market sentiment?
    - What trends are visible?

    ## Customer Demand Signals
    What tells you customers want this?
    - Demand indicators from evidence
    - Consumer preferences observed
    - Trend observations

    ## Business Implications
    What does this mean for a restaurant owner?
    - Should they proceed?
    - What's the opportunity?
    - What risks exist?

    ## Data Limitations
    What information is missing or incomplete?

    ## Evidence Gaps
    What additional information would help?

  # ==========================================================
# COMPETITIVE ANALYSIS PROMPT
# ==========================================================

  competitive_analysis_prompt: |
    You are a restaurant competition analyst.

    Concept: {restaurant_concept}
    Location: {local_area}, {city}, {state}

    Retrieved Competitor Insights:
    {section_insights}

    {common_rules}

    Generate ONLY these sections. Do not add extra sections.

    ## Competitor Landscape
    List competitors found in evidence:

    | Name | Category | Rating | Reviews | Price |
    |------|----------|--------|---------|-------|
    | ...  | ...      | ...    | ...     | ...   | 

    ## Pricing Position
    Analyze observed pricing patterns:
    - What price points exist?
    - Where are the gaps?
    - What does this mean for positioning?

    ## Competitive Strengths
    What patterns emerge from existing competitors?
    - What makes them successful?
    - What can be learned?

    ## Market Gaps
    What opportunities are not being served?
    - Price gaps
    - Cuisine gaps
    - Service gaps

    ## Data Limitations
    What competitor information is not available?

  # ==========================================================
  # CUSTOMER DEMOGRAPHICS PROMPT
  # ==========================================================

  customer_demographics_prompt: |
    You are analyzing customer demographics for a restaurant owner.

    Location: {local_area}, {city}, {state}
    Target: {target_demographic}

    Retrieved Insights:
    {section_insights}

    {common_rules}

    Generate ONLY these sections. Do not add extra sections.

    ## Population Profile
    Who lives and works here?
    - Age groups
    - Income levels
    - Occupation types

    ## Dining Preferences
    What do customers want?
    - Preferred cuisines
    - Dining frequency
    - Average spend range (from competitor prices)

    ## Customer Patterns
    When and how do customers eat?
    - Residential vs commercial mix
    - Weekend vs weekday activity

    ## Implications for Restaurant Owner
    Based on customer profile:
    - What should the menu include?
    - What price point works?
    - What are the operating hours?

    ## Data Limitations
    What demographic information is not available?

  # ==========================================================
  # LOCATION ANALYSIS PORMPT
  # ==========================================================

  location_analysis_prompt: |
    You are a location analyst evaluating restaurant site viability.

    Location: {local_area}, {city}, {state}

    Retrieved Insights:
    {section_insights}

    {common_rules}

    Generate ONLY these sections. Do not add extra sections.

    ## Accessibility
    Can customers reach this location?
    - Road connectivity and visibility
    - Public transport
    - Parking availability

    ## Surrounding Area
    What's around this location?
    - Residential or commercial activity
    - Nearby offices, malls, schools, or tourist spots

    ## Footfall Indicators
    Will customers come?
    - Commercial density
    - Weekday vs weekend activity
    - Any footfall data mentioned

    ## Location Assessment
    Is this location suitable?
    - Key strengths
    - Potential challenges
    - Suitability for restaurant

    ## Data Limitations
    What location data is unavailable?

  # ==========================================================
  # COMPLIANCE REQUIREMENTS PORMPT
  # ==========================================================

  compliance_requirements_prompt: |
    You are a restaurant compliance specialist.

    Concept: {restaurant_concept}
    Location: {city}, {state}

    Regulatory Insights:
    {section_insights}

    {common_rules}

    Generate ONLY these sections. Do not add extra sections.

    ## Required Licenses and Permits
    List all licenses and permits mentioned in the evidence with details:
    - License/permit name
    - Issuing authority
    - Cost (if mentioned)
    - Timeline (if mentioned)
    - Validity period (if mentioned)
    - Prerequisites (if mentioned)

    ## Operational Compliance
    List operational requirements mentioned in the evidence:
    - **Working Hours**: Daily and weekly limits
    - **Staff Requirements**: Hiring, verification, training
    - **Health and Safety**: Inspections, hygiene, food safety
    - **Reporting**: Change reporting, renewals, notifications

    ## Penalties and Fines
    List penalties mentioned in the evidence:
    - Violation type
    - Penalty amount
    - Imprisonment (if mentioned)
    - Authority that enforces

    ## Authorities Mentioned
    List all regulatory bodies and their roles.

    ## Compliance Checklist
    Provide practical, actionable steps:
    - Step with timeline
    - Responsible authority
    - Frequency (one-time, annual, etc.)

    ## Data Limitations
    - What compliance information is missing?

    Never invent license names, fees, or authorities.

  # ==========================================================
  # RISK ASSESSMENT PROMPT
  # ==========================================================

  risk_assessment_prompt: |
    You are a risk analyst helping a restaurant owner identify potential risks.

    Business Context:
    Concept: {restaurant_concept}
    Location: {local_area}, {city}

    Research Insights from all previous sections:
    {section_insights}

    {common_rules}

    Generate ONLY these sections. Do not add extra sections.

    ## Market Risks
    From Market Analysis and Competitive Analysis:
    - What competitive threats exist?
    - Is the market saturated?
    - Based on available evidence

    ## Location Risks
    From Location Analysis:
    - Accessibility issues?
    - Footfall concerns?
    - Based on available evidence

    ## Operational Risks
    From Compliance and Demographics:
    - Regulatory compliance risks
    - Staffing risks
    - Target audience mismatch
    - Based on available evidence

    ## Financial Risks
    From Investment and compliance:
    - Is the investment adequate?
    - Hidden costs mentioned?
    - Based on available evidence

    For each risk include:
    - Risk description
    - Specific evidence
    - Severity: High/Medium/Low
    - Practical mitigation

    ## Unknown Risks
    What cannot be evaluated without more data?

    Every risk must trace to specific evidence.

    ## Data Limitations
    What missing information could hide additional risks?

  # ==========================================================
  # STRATEGIC RECOMMENDATIONS PROMPT
  # ==========================================================

  strategic_recommendations_prompt: |
    You are a restaurant business strategy consultant.

    Business Context:
    Concept: {restaurant_concept}
    Location: {local_area}, {city}

    Research Insights from all sections:
    {section_insights}

    {common_rules}

    Generate ONLY these sections. Do not add extra sections.

    ## Strategic Opportunities
    What opportunities should the restaurant owner pursue?
    - Supported by research
    - Practical to execute

    ## Recommended Positioning
    How should the restaurant position itself?
    - Target Audience (who to serve)
    - Unique Selling Proposition (what makes it special)
    - Pricing Strategy (what to charge)
    - Brand Identity (how to present)

    ## Action Plan
    What should the restaurant owner do next?
    - Provide 4-6 practical, actionable steps
    - Prioritize by importance

    ## Success Factors
    What is needed for success?
    - Capabilities required
    - Resources needed
    - Key risks to watch

    ## Data Limitations
    What additional information would strengthen these recommendations?

    Avoid unsupported assumptions.

# ============================================================
# FINAL REPORT PROMPT
# ============================================================

  final_report_prompt:

    executive_summary: |
      You are preparing an executive summary for a restaurant feasibility report.

      Business Context:
      Concept: {restaurant_concept}
      Location: {local_area}, {city}, {state}
      Investment: {investment}

      Research Insights:
      {section_insights}

      {common_rules}

      Create a concise executive summary covering:

      ## Market Opportunity
      - Is there demand? What's the potential?

      ## Competitive Position
      - Who are the competitors? Where do you fit?

      ## Financial View
      - Investment adequacy
      - Pricing insights from competition

      ## Key Risks
      - What could go wrong?

      ## Data Limitations
      - What information is missing?

      ## Recommendation
      - GO / CONDITIONAL GO / NO GO

      Use only available evidence. Be honest about gaps.

    conclusion: |
      You are preparing the final conclusion of a restaurant feasibility assessment.

      Business Context:
      Concept: {restaurant_concept}
      Location: {local_area}, {city}

      Available Findings:
      {section_insights}

      {common_rules}

      Evaluate:

      ## Overall Assessment
      Based on all evidence, what is the assessment?

      ## Recommendation
      Provide one recommendation:
      GO
      CONDITIONAL GO
      NO GO

      Justify the recommendation using evidence only.

      ## Next Steps
      Provide 4-6 actionable next steps for the restaurant owner.

# ============================================================
# REPORT TEMPLATE
# ============================================================

report_template:

  final_report_template: |
    # RESTAURANT BUSINESS FEASIBILITY REPORT

    Concept:
    {restaurant_concept}

    Location:
    {local_area}, {city}, {state}, {country}

    Investment:
    {investment}

    Date:
    {timestamp}

    {report_sections}