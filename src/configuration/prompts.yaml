# =====================================
# ANALYST GENERATION
# =====================================
analyst_generation:
  dynamic_analysts: |
    Generate exactly {max_analysts} analysts for comprehensive restaurant market research.

    BUSINESS CONTEXT:
    - Concept: {restaurant_concept}
    - Location: {local_area}, {city}, {state} {pincode}
    - Investment: {investment}
    - Target Market: {target_demographic}
    - Special Focus: {special_note}
    - Available Tools: {available_tools}
    - Required Expertise Areas: {required_roles}

    ✅ DO:
    - Cover ALL expertise areas from {required_roles}
    - Create specific role names (e.g., "Local Cost Analyst" not "Market Analyst")
    - Match tools directly to each analyst's specific research task
    - Write descriptions that say EXACTLY what data they will find
    - Use {max_analysts} analysts exactly

    ❌ DON'T:
    - Use vague role names like "Research Specialist" or "Market Analyst"
    - Assign generic tools without clear purpose
    - Write fluffy descriptions like "analyze market trends"
    - Miss any required expertise areas
    - Generate more or fewer than {max_analysts} analysts

    RESEARCH STRATEGY:
    - Each analyst must have a unique specialization
    - Assign tools based on analyst expertise (1-3 tools per analyst)
    - Ensure comprehensive coverage of restaurant market research domains
    - Tools should match analyst role and research focus

    OUTPUT REQUIREMENTS:
    - Exactly {max_analysts} analysts in JSON array format
    - Each analyst must have: role, affiliation, tools, description
    - Descriptions should be specific and action-oriented
    - Tools must be from available tools list only

    OUTPUT FORMAT (STRICT JSON):
    [
      {{
        "role": "Specialized role name",
        "affiliation": "Research firm or expertise area",
        "tools": ["tool1", "tool2"],
        "description": "Specific research focus and methodology"
      }}
    ]


# =====================================
# RESEARCH
# =====================================
research:
  single_analyst: |
    You are {analyst_role} from {affiliation}, specializing in {description}.

    RESEARCH CONTEXT:
    - Restaurant Concept: {restaurant_concept}
    - Location: {local_area}, {city}, {state} {pincode} ({full_city})
    - Investment Scope: {investment}
    - Target Demographic: {target_demographic}
    - Special Considerations: {special_note}

    ✅ DO:
    - Find VERIFIABLE data (specific prices, counts, names, addresses)
    - Answer: "What ONE fact would change the business decision?"
    - Be specific (e.g., "Rent at 123 Main St: ₹50,000/month, 500 sq ft")
    - Cite sources/methods (e.g., "Called 3 suppliers on Nov 15")
    - Focus on your assigned {description} expertise

    ❌ DON'T:
    - Give general trends or obvious advice
    - Use percentages without base numbers
    - Say "market is growing" without local proof
    - Repeat what other analysts would find
    - Provide generic recommendations

    RESEARCH FOCUS:
    - Conduct specialized analysis based on your expertise
    - Gather location-specific market intelligence
    - Provide actionable insights for restaurant feasibility
    - Focus on your assigned research domains

    OUTPUT REQUIREMENTS:
    - Factual, data-driven analysis
    - Location-specific insights
    - Professional business writing style
    - No generic or theoretical content


  optimized_analysis: |
    ANALYST PROFILE:
    - Role: {analyst_role}
    - Affiliation: {affiliation} 
    - Specialization: {description}

    BUSINESS CONTEXT:
    - Concept: {restaurant_concept}
    - Location: {local_area}, {city}, {state} {pincode}
    - Investment: {investment}
    - Target Demographic: {target_demographic}

    RESEARCH DATA:
    {research_findings}

    STRUCTURED INSIGHTS:
    {structured_data}

    ✅ DO:
    - Extract the 2-3 most important numbers
    - Explain what each number MEANS for the business
    - Warn if data is contradictory or unreliable
    - Answer: "Based on this, should they do X or Y?"
    - Connect findings to specific business decisions

    ❌ DON'T:
    - Summarize all data equally
    - Hide uncertainties or data conflicts
    - Use jargon without business translation
    - Give recommendations without clear "why"
    - Ignore location-specific factors

    ANALYSIS TASK:
    Synthesize the research findings into a comprehensive analytical report.

    REQUIRED SECTIONS:
    1. KEY FINDINGS - Most important research discoveries
    2. MARKET ASSESSMENT - Location-specific opportunities and challenges
    3. BUSINESS IMPLICATIONS - What this means for the restaurant concept
    4. RECOMMENDATIONS - Actionable insights based on research

    OUTPUT GUIDELINES:
    - Maintain professional analytical tone
    - Connect findings to specific business decisions
    - Prioritize location-relevant insights
    - Include both quantitative and qualitative assessment


# =====================================
# REPORT GENERATION
# =====================================
reporting:
  executive_summary: |
    Generate a comprehensive executive summary for restaurant feasibility.

    RESEARCH CONTEXT:
    - Concept: {restaurant_concept}
    - Investment: {investment}
    - Target Demographic: {target_demographic}
    - Location: {local_area}, {city}, {state} {pincode}
    - Research Quality: {research_quality}
    - Data Sources: {successful_tools}
    - Analyst Consensus: {analyst_consensus}

    RESEARCH INSIGHTS:
    {key_research_insights}

    ✅ DO:
    - Give 3 specific, data-driven reasons
    - State the ONE biggest deal-breaker risk
    - Name the ONE most critical first action
    - Reference specific findings from {key_research_insights}

    ❌ DON'T:
    - Bury the bottom line in executive fluff
    - List all findings equally
    - Make unsupported optimistic claims
    - Ignore risks mentioned in {analyst_consensus}
    - Use vague language like "synergistic opportunity"

    STRUCTURE:
    1. BUSINESS OPPORTUNITY - Market gap and potential in {local_area}
    2. COMPETITIVE POSITIONING - How concept fits in local market
    3. FINANCIAL VIABILITY - Investment outlook and projections
    4. KEY SUCCESS FACTORS - Critical elements for success
    5. STRATEGIC RECOMMENDATION - Go/no-go assessment with rationale

    REQUIREMENTS:
    - Data-driven conclusions based on {total_analysts} analyst perspectives
    - Reference specific research findings where applicable
    - Balance optimism with realistic risk assessment
    - Clear, decisive business recommendation


  market_analysis: |
    Produce detailed market analysis based on comprehensive research.

    BUSINESS CONTEXT:
    - Concept: {restaurant_concept}
    - Location: {local_area}, {city}, {state} {pincode}
    - Target Demographic: {target_demographic}
    - Research Confidence: {confidence_level}

    RESEARCH DATA:
    - Supporting Insights: {supporting_data_points}
    - Key Findings: {key_research_insights}
    - Data Quality: {data_quality_indicator}

    ✅ DO:
    - Use ONLY verified, non-contradictory numbers
    - Name EXACT competitors (with addresses if possible)
    - Compare to city/sector averages
    - State exact location pros/cons
    - Calculate: (Foot traffic × realistic conversion rate)

    ❌ DON'T:
    - Include conflicting data - choose most reliable source
    - Use generic labels like "young professionals"
    - Say "good location" without specific advantages
    - List trends without local proof
    - Use incomplete tables or cutoff sentences

    REQUIRED SECTIONS:
    1. MARKET SIZE & DEMOGRAPHICS - Quantitative assessment of target market
    2. COMPETITIVE LANDSCAPE - Direct and indirect competitors in area
    3. CONSUMER BEHAVIOR PATTERNS - Spending habits and preferences
    4. LOCATION ANALYSIS - Foot traffic, accessibility, visibility assessment
    5. MARKET TRENDS & GROWTH - Current and projected market dynamics

    ANALYSIS GUIDELINES:
    - Base all conclusions on research data from {total_analysts} sources
    - Include specific location references and data points
    - Highlight both opportunities and market challenges
    - Provide comparative analysis where relevant
    - Use tables with only complete data
    - Do not use cutoff or incomplete sentences.


  financial_recommendations: |
    Develop financial recommendations based on market research.

    BUSINESS PARAMETERS:
    - Concept: {restaurant_concept}
    - Investment Base: {investment}
    - Location: {local_area}, {city}
    - Target Market: {target_demographic}

    RESEARCH CONTEXT:
    - Data Quality: {research_quality}
    - Analyst Inputs: {total_analysts} perspectives
    - Market Insights: {key_research_insights}

    ✅ DO:
    - Start with NON-NEGOTIABLE costs (rent, licenses, utilities)
    - Calculate DAILY break-even: (customers needed × average bill)
    - Show 3 scenarios: Bad/Okay/Good months
    - List exact local prices from research
    - Warn about cash flow gaps by month

    ❌ DON'T:
    - Assume perfect execution or best-case scenarios
    - Hide cash flow timing issues
    - Use industry averages without local adjustment
    - Forget seasonal/holiday impacts
    - Create incomplete tables or partial sentences

    FINANCIAL FRAMEWORK:
    1. CAPITAL ALLOCATION STRATEGY
       - Startup costs breakdown
       - Working capital requirements
       - Contingency planning

    2. REVENUE PROJECTIONS
       - Realistic sales forecasts based on market data
       - Pricing strategy aligned with local market
       - Seasonality and growth projections

    3. COST STRUCTURE ANALYSIS
       - Fixed vs variable costs
       - Local cost factors (rent, labor, utilities)
       - Efficiency recommendations

    4. FINANCIAL METRICS
       - Break-even analysis
       - Return on investment timeline
       - Cash flow management

    REQUIREMENTS:
    - All projections must be justified by research data
    - Include location-specific cost factors
    - Provide realistic, conservative estimates
    - Highlight key financial risks and mitigations
    - Use tables with only complete data
    - Do not use cutoff or incomplete sentences.


  risk_assessment: |
    Conduct comprehensive risk assessment for restaurant venture.

    BUSINESS CONTEXT:
    - Concept: {restaurant_concept}
    - Location: {local_area}, {city}
    - Investment: {investment}
    - Research Basis: {total_analysts} analyst perspectives

    IDENTIFIED RISKS:
    {supporting_data_points}

    ✅ DO:
    - Rank risks by "Will this kill the business?"
    - Connect each risk to SPECIFIC data from research
    - Give TESTABLE mitigation (not "monitor the situation")
    - Include timing (e.g., "Risk peaks in monsoon season")
    - Use complete table rows with all columns filled

    ❌ DON'T:
    - List generic business risks everyone faces
    - Recommend vague actions like "have a plan"
    - Separate likelihood from impact assessment
    - Ignore location-specific threats
    - Leave table cells empty or use incomplete sentences

    RISK ASSESSMENT FRAMEWORK:

    1. MARKET & COMPETITIVE RISKS
       - Competition intensity and response
       - Market saturation concerns
       - Changing consumer preferences

    2. OPERATIONAL RISKS
       - Location-specific operational challenges
       - Supply chain and vendor reliability
       - Staffing and management issues

    3. FINANCIAL RISKS
       - Revenue volatility and seasonality
       - Cost escalation and margin pressure
       - Capital requirements and cash flow

    4. EXTERNAL RISKS
       - Regulatory and compliance requirements
       - Economic and demographic shifts
       - Location-specific environmental factors

    FOR EACH RISK CATEGORY:
    - Likelihood assessment (High/Medium/Low)
    - Potential impact analysis
    - Recommended mitigation strategies
    - Monitoring and response planning
    - Use tables with only complete data
    - Do not use cutoff or incomplete sentences.


  implementation_roadmap: |
    Create practical implementation roadmap for restaurant launch.

    BUSINESS CONTEXT:
    - Concept: {restaurant_concept}
    - Location: {local_area}, {city}, {state}
    - Investment Scope: {investment}

    RESEARCH INSIGHTS:
    - Market Readiness: {research_quality}
    - Key Success Factors: {key_research_insights}

    ✅ DO:
    - List PHYSICAL actions (sign lease, buy fridge, hire cook)
    - Assign ONE responsible person per task
    - Include "STOP IF" conditions for deal-breakers
    - Budget time AND money for each phase
    - Consider local regulatory wait times

    ❌ DON'T:
    - Include "strategic planning" as a task
    - Assume tasks can happen in parallel
    - Forget local license processing times
    - Make success dependent on perfect conditions
    - Create unrealistic timelines

    IMPLEMENTATION PHASES:

    PHASE 1: PRE-LAUNCH (Months 1-3)
    - Legal and regulatory compliance
    - Location finalization and lease negotiation
    - Business registration and licenses
    - Initial team assembly

    PHASE 2: SETUP & DEVELOPMENT (Months 4-6)
    - Space build-out and interior design
    - Equipment procurement and installation
    - Menu development and testing
    - Staff hiring and training

    PHASE 3: LAUNCH PREPARATION (Months 7-8)
    - Marketing and promotional campaigns
    - Supplier and vendor contracts
    - Operational systems implementation
    - Soft launch and testing

    PHASE 4: GRAND OPENING & OPERATIONS (Month 9+)
    - Grand opening event
    - Ongoing operations management
    - Performance monitoring and optimization
    - Growth and expansion planning

    REQUIREMENTS:
    - Include specific timelines and milestones
    - Assign responsibility areas
    - Include key decision points
    - Provide practical, actionable steps


  conclusion: |
    Provide final conclusion and strategic recommendation.

    BUSINESS CONTEXT:
    - Concept: {restaurant_concept}
    - Location: {local_area}, {city}, {state}
    - Investment: {investment}
    - Research Quality: {research_quality}

    KEY FINDINGS SUMMARY:
    - Market Opportunity: {key_research_insights}
    - Competitive Position: {supporting_data_points}
    - Financial Outlook: Based on {total_analysts} analyst assessments

    ✅ DO:
    - Answer: "Would you invest your own money here?"
    - Name the ONE thing that must go right
    - Suggest a CHEAP TEST before full commitment
    - State when to re-evaluate (e.g., "Check at 3 months")
    - Be brutally honest about risks

    ❌ DON'T:
    - Repeat earlier sections verbatim
    - Sit on the fence - give clear direction
    - Recommend "more research" as an action
    - Ignore the investor's risk tolerance
    - Make promises based on best-case only

    CONCLUSION STRUCTURE:
    1. OVERALL FEASIBILITY ASSESSMENT
       - Go/No-Go recommendation with confidence level
       - Key success factors and potential challenges

    2. CRITICAL SUCCESS FACTORS
       - Must-have elements for business success
       - Differentiators and competitive advantages

    3. STRATEGIC RECOMMENDATIONS
       - Immediate next steps if proceeding
       - Key considerations for implementation
       - Risk management priorities

    4. LONG-TERM OUTLOOK
       - Growth potential and expansion opportunities
       - Sustainability and scalability assessment

    REQUIREMENTS:
    - Clear, decisive recommendation
    - Evidence-based justification
    - Practical implementation guidance
    - Balanced risk-reward assessment


# =====================================
# FINAL REPORT TEMPLATE
# =====================================
report_templates:
  final_report: |
    # COMPREHENSIVE RESTAURANT FEASIBILITY REPORT
    ## Market Research & Business Analysis

    **Report Generated**: {timestamp}  
    **Concept**: {restaurant_concept}  
    **Proposed Location**: {local_area}, {city}, {state} {pincode}  
    **Investment Scope**: {investment}  
    **Target Market**: {target_demographic}  
    **Research Basis**: {research_metrics}
    **Analysts**: {total_analysts}

    ## EXECUTIVE SUMMARY
    {executive_summary}

    ## 1.0 MARKET ANALYSIS
    {market_analysis}

    ## 2.0 FINANCIAL ANALYSIS & RECOMMENDATIONS
    {financial_recommendations}

    ## 3.0 RISK ASSESSMENT & MITIGATION
    {risk_assessment}

    ## 4.0 IMPLEMENTATION ROADMAP
    {implementation_roadmap}

    ## 5.0 CONCLUSION & STRATEGIC RECOMMENDATION
    {conclusion}

    ---
    *This feasibility report is based on comprehensive market research conducted by {total_analysts} specialized analysts.*