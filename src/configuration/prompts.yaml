# src\configuration\prompts.yaml

# =====================================
# ANALYST GENERATION - ENHANCED
# =====================================
analyst_generation:
  dynamic_analysts: |
    Generate EXACTLY {max_analysts} specialized analysts for restaurant market research.

    BUSINESS CONTEXT:
    - Concept: {restaurant_concept}
    - Location: {target_location} 
    - Investment: {investment}
    - Target: {target_demographic}
    - Focus: {special_note}

    MANDATORY RULES:
    - Generate exactly {max_analysts} analysts - no more, no less
    - Each role must be unique and specific to restaurant market research
    - Available tools: {available_tools}
    - Assign 0-2 tools per analyst based on role relevance
    - Financial Analysts must have EMPTY tools list []
    - Tools must be complementary (no duplicate mapping tools)
    - Focus on concrete data: real numbers, competitor names, specific costs
    - Required roles: {required_roles}

    OUTPUT FORMAT - STRICT JSON ONLY:
    Return a valid JSON array with exactly {max_analysts} analyst objects.

    Each analyst object must have these exact fields:
    - role: string (specific role name)
    - affiliation: string (reputable organization) 
    - tools: array of strings (0-2 tool names)
    - description: string (specific data collection responsibilities)

    Example format (replace with your actual analysts):
    [
      {{
        "role": "Market Research Analyst",
        "affiliation": "Euromonitor International",
        "tools": ["tavily_search"],
        "description": "Analyze market trends and consumer demand patterns"
      }}
    ]

    IMPORTANT: Return ONLY valid JSON, no other text or explanations.
    
# =====================================
# RESEARCH - OPTIMIZED FOR COMPLETENESS
# =====================================
research:
  single_analyst: |
    You are {analyst_role}, a {affiliation} analyst specializing in {description}.
    Analyze: {restaurant_concept} in {target_location}, Investment: {investment}, Target: {target_demographic}, Note: {special_note}
    Provide concrete, data-driven recommendations.

  optimized_analysis: |
    ANALYST: {analyst_role} from {affiliation}
    SPECIALIZATION: {description}
    
    BUSINESS CONTEXT:
    - Restaurant: {restaurant_concept}
    - Location: {target_location}
    - Investment: {investment}
    - Target Market: {target_demographic}
    
    RESEARCH DATA: {research_findings}
    
    CRITICAL INSTRUCTIONS:
    - Write COMPLETE analysis - DO NOT cut off mid-sentence
    - Use ACTUAL numbers from research, not placeholders
    - If no specific data available, state "Data not available" and provide industry estimates
    - NO markdown formatting (no **bold**, no headers)
    - Complete ALL sentences and sections
    
    ANALYSIS SECTION:
    Provide detailed professional analysis based on the research findings. Focus on specific, actionable insights. Include concrete numbers, market opportunities, and strategic recommendations.

    KEY INSIGHTS:
    - [First specific insight with supporting data]
    - [Second specific insight with supporting data]
    - [Third specific insight with supporting data]

    IMPORTANT: Write complete, fully-formed analysis. Do not use asterisks or markdown. Ensure all sentences are complete.

# =====================================
# REPORT GENERATION - PROFESSIONAL STANDARDS
# =====================================
reporting:
  executive_summary: |
    Create professional executive summary (300-400 words) for investment review.

    CONTEXT:
    - Investment: {investment}
    - Target Market: {target_demographic}
    - Research Insights: {research_summary}

    PROFESSIONAL REQUIREMENTS:
    - Formal business language and tone
    - Evidence-based claims from research
    - Strategic focus on investment implications
    - Clear decision-making framework

    STRUCTURED CONTENT:
    1. BUSINESS OPPORTUNITY: Market gap and concept viability
    2. COMPETITIVE POSITIONING: Unique advantages and market alignment  
    3. FINANCIAL OUTLOOK: Key metrics and return potential
    4. STRATEGIC PATH: Clear implementation roadmap

    CRITICAL: Reference detailed analysis sections without data repetition.

  market_analysis: |
    Create comprehensive market analysis meeting consulting standards.

    RESEARCH BASIS: {research_summary}

    **CRITICAL: COMPLETE ALL SECTIONS. DO NOT CUT OFF MID-SENTENCE.**

    ANALYTICAL FRAMEWORK:
    - Data-driven insights with clear sources
    - Industry benchmark comparisons  
    - Integrated SWOT analysis
    - Realistic market sizing

    REQUIRED ANALYSIS SECTIONS - MUST COMPLETE ALL:

    1. MARKET OVERVIEW & SIZING
    - Total Addressable Market (TAM): Quantify overall market value with basis
    - Serviceable Available Market (SAM): Define reachable customer base with calculation
    - Market Growth Trends: Historical and projected CAGR with timeframes
    - Market Drivers: Key factors influencing growth with specific examples

    2. COMPETITIVE LANDSCAPE  
    - Direct Competitors: Top 5 Specific restaurant names, locations, offerings and best selling Products
    - Indirect Competitors: Alternative dining options and their market position
    - Market Share Analysis: Estimated competitor positioning with percentages
    - Competitive Matrix: Complete table comparing price, quality, service
    - Pricing Benchmarking: Current market price points with ranges

    3. CONSUMER INSIGHTS
    - Demographic Analysis: Age, income, occupation profiles with specific ranges
    - Psychographic Profiling: Lifestyle, preferences, values with details
    - Spending Behavior: Average order values, frequency, patterns
    - Consumption Trends: Changing preferences, habits, emerging patterns

    4. LOCATION ASSESSMENT
    - Geographic Analysis: Area characteristics, advantages, limitations
    - Foot Traffic Patterns: Customer volume estimates, peak times
    - Accessibility Evaluation: Transportation, parking, visibility factors
    - Co-location Opportunities: Complementary businesses, synergies

    **IMPORTANT: Write complete paragraphs. Fill all tables completely. Do not leave sections unfinished.**

  financial_recommendations: |
    Create complete financial analysis for investment decision.

    RESEARCH INPUT: {research_summary}
    CAPITAL: {investment}

    **CRITICAL: COMPLETE ALL TABLES AND CALCULATIONS. NO INCOMPLETE CONTENT.**

    FINANCIAL SECTIONS - MUST COMPLETE ALL:

    1. CAPITAL ALLOCATION PLAN
    Create a complete table with ALL months filled:
    | Month | Revenue | Capacity Utilization | Growth Rate |
    |-------|---------|---------------------|-------------|
    | 1     | [calculate] | 40% | Baseline |
    | 2     | [calculate] | 50% | 25% growth |
    | 3     | [calculate] | 60% | 20% growth |
    | 4     | [calculate] | 70% | 17% growth |
    | 5     | [calculate] | 75% | 7% growth |
    | 6     | [calculate] | 80% | 7% growth |
    | 7-12  | [calculate monthly] | 80-85% | Stabilized |

    2. PROFIT & LOSS FORECAST
    - COGS: 32% of revenue (restaurant industry standard)
    - Labor Costs: 25% of revenue  
    - Rent & Utilities: 12% of revenue
    - Marketing: 8% of revenue
    - Other Expenses: 8% of revenue
    - EBITDA Margin: Calculate based on above

    3. INVESTMENT METRICS
    - ROI: Calculate based on ₹350,000 investment
    - Break-even: Calculate months to profitability
    - Payback Period: Estimate capital recovery timeline

    **MANDATORY: All tables must be fully populated. All calculations must be shown.**

  risk_assessment: |
    Create complete enterprise risk management framework.

    RESEARCH BASIS: {research_summary}

    **CRITICAL: COMPLETE ALL RISK CATEGORIES. NO INCOMPLETE SECTIONS.**

    RISK CATEGORIES & ANALYSIS - MUST COMPLETE ALL:

    1. STRATEGIC RISKS (Complete all)
    - Market Acceptance: Customer adoption uncertainty
    - Competitive Response: Rival reaction scenarios  
    - Brand Positioning: Market differentiation challenges
    - Economic Factors: Macroeconomic impacts

    2. OPERATIONAL RISKS (Complete all) 
    - Supply Chain: Vendor reliability and costs
    - Staffing: Recruitment, training, retention
    - Quality Control: Consistency and standards
    - Technology: Systems and process failures

    3. FINANCIAL RISKS (Complete all)
    - Cash Flow: Working capital management
    - Cost Escalation: Input price increases  
    - Revenue Volatility: Demand fluctuations
    - Financing: Capital availability and cost

    4. COMPLIANCE RISKS (Complete all)
    - Regulatory: Licensing and permit requirements
    - Health & Safety: Standards and inspections
    - Employment: Labor law compliance
    - Environmental: Waste management and sustainability

    **FOR EACH RISK: Provide complete Risk Score, Mitigation Strategy, Responsibility, Timeline, Monitoring**

