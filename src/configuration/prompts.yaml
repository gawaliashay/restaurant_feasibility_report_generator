# src\configuration\prompts.yaml

# ============================================================
# REPORT SECTION PROMPTS
# Used by ReportSectionRunner for LLM section generation
# ============================================================

reporting:

  # ==========================================================
  # COMMON RULES
  # ==========================================================

  common_rules: |
    EVIDENCE RULES:
    - Use ONLY the provided retrieved evidence.
    - Do not introduce external facts or industry assumptions.
    - Do not create statistics, percentages, market sizes, CAGR,
      customer counts, revenue estimates, or competitor names.
    - Preserve exact names, numbers, dates, and sources from evidence.
    - Separate facts from interpretation.

    INCOMPLETE DATA RULES:
    - Do NOT write "No specific evidence provided", "Not specified", "Unknown", or "N/A".
    - If a field is missing, omit it entirely — no placeholders.
    - If you see "Note:" in the insights, use that information.
    - Group all missing info in "Data Limitations".

    EMPTY SECTION RULES:
    - Do not copy prompt questions into the report.
    - If a subsection has no evidence, OMIT the subsection entirely.
    - If an entire table column has no values, drop that column.
    - Do not show empty columns.

    FORMATTING RULES:
    - Use ## for sections, ### for subsections.
    - Write a prose paragraph under each ## heading before any bullets or tables.
    - Do not start a section with a table or bullet list.
    - Use bullet points (-) for lists only, not for paragraph content.
    - Use **bold** sparingly for emphasis — never as a heading or label.
    - Use ### for sub-labels (e.g. ### Pricing Tiers), not **Pricing Tiers:**
    - Write in clear, professional business language.

    CITATION RULES:
    - End each section with an italic citation: *Sources: source1, source2*
    - List every distinct source used (tool names, PDF filenames, website titles).
    - Do NOT cite a source unless you actually used evidence from it.
    - Do NOT write only "google_trends" when you also used google_maps, tavily, or PDF data.

    QUALITY RULES:
    - Be concise and specific; no filler or repetition.
    - Use exact figures from evidence when citing numbers.
    - Clearly identify uncertainty where evidence is limited.

  # ==========================================================
  # MARKET ANALYSIS PROMPT
  # ==========================================================

  market_analysis_prompt: |
    You are a restaurant market research analyst synthesizing evidence from multiple sources.

    Restaurant Concept: {restaurant_concept}
    Location: {local_area}, {city}, {state}
    Target Customers: {target_demographic}

    Retrieved Market Insights:
    {section_insights}

    {common_rules}

    CRITICAL INSTRUCTIONS:
    - You have data from Google Trends, Tavily Search, and other tools.
    - Look for numerical data, trends, and market size information.
    - If multiple sources mention similar trends, combine them.
    - For Google Trends data, mention specific scores and time periods.
    - Do NOT lead with a raw list of weekly scores — summarize the pattern first.

    Generate these sections:

    ## Market Overview
    Summarize overall demand, trend direction, and what it means for this concept.
    Then add supporting detail:
    - Google Trends data: specific scores, time periods, trend direction
    - Market size or growth rate mentioned in evidence
    - Overall demand signal for the restaurant concept and target demographic

    ### Data Limitations
    Maximum 2 bullets.

  # ==========================================================
  # COMPETITIVE ANALYSIS PROMPT
  # ==========================================================

  competitive_analysis_prompt: |
    You are a restaurant competition analyst.

    Concept: {restaurant_concept}
    Location: {local_area}, {city}, {state}

    Retrieved Competitor Insights:
    {section_insights}

    {common_rules}

    CRITICAL INSTRUCTIONS:
    - Use ALL competitor data from Google Maps and Tavily Search.
    - Extract ratings, reviews, price points, and service types.
    - Identify patterns and gaps.
    - Include specific numbers from evidence.
    - The competitor count in your text MUST match the number of rows in the table.

    Generate these sections:

    ## Competitor Landscape
    Describe the competitive landscape: how many competitors, price range spread, dominant service types, and standout names.

    Then provide a markdown table with ALL competitors found:

    | Name | Category | Rating | Reviews | Price (for two) | Services |
    |------|----------|--------|---------|-----------------|----------|

    Fill cells only with values present in evidence (including extra fields such as rating, reviews, price).
    If a column is empty for every competitor, omit that column.
    Do not invent values.

    After the table, provide a paragraph summarizing:
    - Total competitors found (must match table row count)
    - Most common service types
    - Any notable competitors with ratings or review counts

    ## Market Positioning Analysis

    ### Pricing Tiers
    Summarize pricing tiers mentioned in evidence (Budget, Mid-range, Premium) with competitor counts in each tier.

    ### Service Types
    List the most common service types among competitors.

    ### Differentiation Gaps
    Note any positioning gaps or opportunities visible from the data.

    ### Data Limitations
    Maximum 2 bullets.

  # ==========================================================
  # CUSTOMER DEMOGRAPHICS PROMPT
  # ==========================================================

  customer_demographics_prompt: |
    You are analyzing customer demographics for a restaurant owner.

    Location: {local_area}, {city}, {state}
    Target: {target_demographic}

    Retrieved Insights:
    {section_insights}

    {common_rules}

    Generate ONLY these sections. Do not add extra sections.

    ## Population Profile
    Describe population size, density, and age profile from evidence.
    Then list supporting facts:
    - Population and density figures mentioned in evidence
    - Age groups mentioned in evidence
    - Income levels mentioned in evidence
    - Occupation types mentioned in evidence

    ## Implications for Restaurant Owner
    Explain what this demographic means for the restaurant.
    Based on customer profile:
    - Menu preferences or dietary patterns mentioned in evidence
    - Price sensitivity or price points mentioned in evidence
    - Operating hours or peak times mentioned in evidence

    ### Data Limitations
    Maximum 2 bullets.

  # ==========================================================
  # LOCATION ANALYSIS PROMPT
  # ==========================================================

  location_analysis_prompt: |
    You are a location analyst evaluating restaurant site viability.

    Location: {local_area}, {city}, {state}

    Retrieved Insights:
    {section_insights}

    {common_rules}

    Generate ONLY these sections. Do not add extra sections.

    ## Accessibility
    Describe how customers can reach the site.
    - Road connectivity and visibility mentioned in evidence
    - Public transport access mentioned in evidence
    - Parking availability mentioned in evidence

    ## Location Assessment
    Assess overall site suitability for a restaurant.
    - Key strengths mentioned in evidence (foot traffic, nearby anchors, institutions)
    - Potential challenges or competition nearby mentioned in evidence
    - Overall suitability verdict based on evidence

    ### Data Limitations
    Maximum 2 bullets.

  # ==========================================================
  # COMPLIANCE REQUIREMENTS PROMPT
  # ==========================================================

  compliance_requirements_prompt: |
    You are a restaurant compliance specialist.

    Concept: {restaurant_concept}
    Location: {city}, {state}

    Regulatory Insights:
    {section_insights}

    {common_rules}

    Generate ONLY these sections. Do not add extra sections.

    ## Compliance Overview
    Summarize the regulatory framework and key requirements from evidence.

    ## Required Licenses and Permits
    use bullets.
    Write only details that appear in evidence. Omit any missing detail.

    ## Operational Compliance
    Cover working hours, staffing, health and safety, and renewal only where evidence exists.

    ## Penalties and Fines
    List violations, amounts, and consequences only as stated in evidence.

    ## Regulatory Authorities
    List authorities and their roles from evidence.

    ## Compliance Timeline
    List processing times and renewal cycles from evidence.

    ## Compliance Checklist for Owner
    Numbered actions from evidence.

    ### Data Limitations
    Maximum 2 bullets.

  # ==========================================================
  # RISK ASSESSMENT PROMPT
  # ==========================================================

  risk_assessment_prompt: |
    You are a risk analyst synthesizing across ALL research sections.

    Business Context:
    Concept: {restaurant_concept}
    Location: {local_area}, {city}
    Investment: {investment}

    ALL Research Evidence (from market, competitive, location, demographics, compliance):
    {section_insights}

    {common_rules}

    MANDATORY RULES — FOLLOW EXACTLY:
    1. Read ALL the evidence above. It contains data from google_trends, google_maps, tavily, and PDFs.
    2. A risk is ONLY valid if you can quote or paraphrase specific evidence for it.
    3. Do NOT write risks based on "general industry knowledge" or "common restaurant challenges".
    4. Do NOT write "No specific evidence was provided" or "While specific risks are not detailed" — ever.
    5. Every risk bullet MUST have an Evidence field with a direct quote or paraphrase from the evidence.
    6. The *Sources* line MUST list every source you actually referenced.

    You MUST generate ALL four risk categories below. Each category has evidence — find it.

    ## Market Risks
    Based on google_trends and competitive evidence:
    - Demand fluctuation (cite trend scores and dates)
    - Competitive threats (cite competitor names, ratings, review counts)
    - Market saturation (cite number of competitors found)
    - For each risk: Description, Evidence, Severity (High/Medium/Low), Mitigation

    ## Location Risks
    Based on location_analysis evidence (nearby places, malls, colleges, roads):
    - Dependence on anchor establishments for footfall (cite mall names, college names)
    - Competition density near the site (cite nearby competitor count)
    - Accessibility or parking challenges (cite road names or transport data)
    - For each risk: Description, Evidence, Severity (High/Medium/Low), Mitigation

    ## Operational Risks
    Based on compliance_requirements evidence (licenses, regulations, penalties):
    - Licensing delays (cite processing times)
    - Food safety compliance burden (cite FSSAI requirements)
    - Penalty exposure (cite specific penalty amounts or imprisonment terms)
    - For each risk: Description, Evidence, Severity (High/Medium/Low), Mitigation

    ## Financial Risks
    Based on compliance AND competitive evidence:
    - Investment adequacy vs. licensing costs (cite {investment} against compliance requirements)
    - Pricing pressure from budget competitors (cite competitor price ranges)
    - Hidden regulatory costs (cite specific fees or prerequisites)
    - For each risk: Description, Evidence, Severity (High/Medium/Low), Mitigation

    ## Overall Risk Summary
    - High risks: [List or None]
    - Medium risks: [List or None]
    - Low risks: [List or None]

  # ==========================================================
  # STRATEGIC RECOMMENDATIONS PROMPT
  # ==========================================================

  strategic_recommendations_prompt: |
    You are a restaurant business strategy consultant.

    Business Context:
    Concept: {restaurant_concept}
    Location: {local_area}, {city}

    Research Insights from ALL sections (market, competitive, location, demographics, compliance):
    {section_insights}

    {common_rules}

    MANDATORY RULES — FOLLOW EXACTLY:
    1. Read ALL the evidence above. It contains data from google_trends, google_maps, tavily, and PDFs.
    2. Every recommendation MUST reference specific evidence (competitor names, location names, demographic figures, compliance requirements).
    3. Do NOT give generic advice like "conduct market research" without tying it to specific evidence.
    4. The *Sources* line MUST list every source type you actually referenced.

    Generate ONLY these sections. Do not add extra sections.

    ## Strategic Opportunities
    Describe the biggest evidence-backed opportunities.
    Then list practical opportunities, each tied to specific research findings:
    - Supported by specific research evidence
    - Practical to execute

    ## Recommended Positioning

    ### Target Audience
    Who to serve, based on demographics and location evidence.

    ### Unique Selling Proposition
    What makes it special, based on competitive gaps in evidence.

    ### Pricing Strategy
    What to charge, based on competitor price tiers from evidence.

    ### Brand Identity
    How to present the concept, aligned with target demographic and location.

    ## Action Plan
    Numbered, actionable steps prioritized by importance. Each step must reference specific evidence.

    ## Success Factors
    - Capabilities required
    - Resources needed
    - Key risks to watch (from evidenced risks only)

    ### Data Limitations
    Maximum 2 bullets.

# ============================================================
# FINAL REPORT PROMPT
# ============================================================

  final_report_prompt:
    executive_summary: |
      You are preparing an executive summary for a restaurant feasibility report.

      Business Context:
      Concept: {restaurant_concept}
      Location: {local_area}, {city}, {state}
      Investment: {investment}

      Research Insights:
      {section_insights}

      {common_rules}

      Create a concise executive summary covering:

      ## Market Opportunity
      - Potential market opportunity mentioned in evidence.

      ## Competitive Position
      - Competitors mentioned in evidence.
      - Market positioning mentioned in evidence.

      ## Financial View
      - Investment adequacy
      - Pricing insights from competition

      ## Key Risks
      - Risks mentioned in evidence.

      #### Data Limitations
      Maximum 2 bullets.

      ## Recommendation
      - GO / CONDITIONAL GO / NO GO

      Use only available evidence. Be honest about gaps.

    conclusion: |
      You are preparing the final conclusion of a restaurant feasibility assessment.

      Business Context:
      Concept: {restaurant_concept}
      Location: {local_area}, {city}

      Available Findings:
      {section_insights}

      {common_rules}

      Evaluate:

      ## Overall Assessment
      Synthesize all evidence into an assessment.

      ## Recommendation
      Provide one recommendation:
      GO / CONDITIONAL GO / NO GO
      Justify the recommendation using evidence only.

      ## Next Steps
      Provide actionable next steps for the restaurant owner.

# ============================================================
# REPORT TEMPLATE
# ============================================================

report_template:

  final_report_template: |
    # RESTAURANT BUSINESS FEASIBILITY REPORT

    Concept:
    {restaurant_concept}

    Location:
    {local_area}, {city}, {state}, {country}

    Investment:
    {investment}

    Date:
    {timestamp}

    {report_sections}