# src\configuration\configs.yaml

# =====================================
# PATHS & DIRECTORIES
# =====================================
paths:
  data: ${DATA_PATH}
  vector_store: ${VECTOR_STORE_PATH}
  reports: ${REPORTS_DIRECTORY}
  logs_dir: logs/

# =====================================
# APPLICATION CONFIGURATION
# =====================================
app:
  name: ${PROJECT_NAME}
  env: ${ENV}
  host: ${HOST}
  port: ${PORT}   
  cors_origins: ${ALLOWED_ORIGINS}

# =====================================
# API CONFIGURATION
# =====================================
apis:
  tavily:
    api_key: ${TAVILY_API_KEY}
  serpapi:
    api_key: ${SERPAPI_API_KEY}

# =====================================
# EXPORT CONFIGURATION
# =====================================
export:
  formats: ["md", "json"]
  timestamp_format: "%Y%m%d_%H%M%S"


# =====================================
# BUSINESS CASE CONFIGURATION
# =====================================
business_case:
  default:
    restaurant_concept: "momo Restaurant"
    location:
      society: "rise avenue"
      local_area: "Baner"
      city: "Pune"
      state: "Maharashtra"
      pincode: "411058"
    investment: "₹350,000"
    target_demographic: "Professionals 25-45, health-conscious"
    special_note: "momo demand, spending power, competition density"

# =====================================
# ANALYSIS CONFIGURATION
# =====================================
research:
  sections:
    market_analysis:
      enabled: true
      title: Market Analysis
      prompt: market_analysis
      tools:
        - google_trends
        - tavily_search
      dependencies: []

    competitive_analysis:
      enabled: true
      title: Competitive Analysis
      prompt: competitive_analysis
      tools:
        - google_maps
        - tavily_search
      dependencies: []

    location_analysis:
      enabled: true
      title: Location Analysis
      prompt: location_analysis
      tools:
        - google_maps
        - tavily_search
      dependencies: []

    customer_demographics:
      enabled: true
      title: Customer Demographics
      prompt: customer_demographics
      tools:
        - tavily_search
      dependencies: []

    compliance_requirements:
      enabled: true
      title: Compliance Requirements
      prompt: compliance_requirements
      tools:
        - rag
      dependencies: []

    risk_assessment:
      enabled: true
      title: Risk Assessment
      prompt: risk_assessment
      tools: []
      dependencies:
        - market_analysis
        - competitive_analysis
        - location_analysis
        - customer_demographics
        - compliance_requirements

    strategic_recommendations:
      enabled: true
      title: Strategic Recommendations
      prompt: strategic_recommendations
      tools: []
      dependencies:
        - risk_assessment


# =====================================
# TOOL CONFIGURATION
# =====================================
tools:

  rag:
    name: "Compliance RAG"
    description: "Retrieve restaurant compliance regulations from the knowledge base."
    function: "use_rag"
    max_results: 8
    parameters:
      search_query:
        template:
          - "{restaurant_concept} regulations in {state}"
          - "restaurant licenses in {state}"
          - "food safety compliance in {state}"
        required: true

  tavily_search:
    name: "Tavily Search"
    description: "Web search for local area demographics and market trends"
    function: "use_tavily_search"
    max_results: 15
    parameters:
      search_query:
        template:
          - "{restaurant_concept} in {local_area} {city}"
          - "customer demographics in {local_area} {city}"
          - "food preferences in {local_area} {city}"
          - "restaurant competition in {local_area} {city}"
          - "footfall in {local_area} {city}"
          - "commercial activity in {local_area} {city}"
        required: true
    
    
  google_trends:
    name: "Google Trends" 
    description: "Trend analysis for restaurant concept popularity"
    function: "use_google_trends"
    max_points: 20
    parameters:
      trend_query:
        template: "{restaurant_concept}"
        required: true
    
  google_maps:
    name: "Google Maps"
    description: "City-level competition analysis and business density"
    function: "use_google_maps"
    max_results: 15
    parameters:
      location:
        template: "{city}, {state}, India"
        required: true
      map_query:
        template: "{restaurant_concept} in {local_area}, {city}" 
        required: true

# =====================================
# DEFAULTS
# =====================================
defaults:
  primary_llm: groq
  fast_llm: groq
  creative_llm: groq
  analysis_llm: groq

# =====================================
# MODELS
# =====================================
models:
  llms:
    groq:
      model_name: llama-3.1-8b-instant
      import_path: langchain_groq.ChatGroq
      api_key: ${GROQ_API_KEY}
      temperature: 0.3
      max_tokens: 4096

    openai:
      model_name: gpt-4o-mini
      import_path: langchain_openai.ChatOpenAI
      api_key: ${OPENAI_API_KEY}
      temperature: 0.3
      max_tokens: 4096

# =====================================
# REPORT CONFIGURATION
# =====================================
# Add to configs.yaml under reporting section
reporting:
  save_to_file: true
  reports_directory: "reports"
  create_backup: true
  save_formats: ["md", "json"]

# =====================================
# REPORT QUALITY CONFIGURATION
# =====================================
# Controls how detailed/expensive the report generation is
# 
# mode: "balanced"  → Default, good quality, moderate cost
# mode: "quality"   → Maximum detail, higher cost, for demos/interviews
# mode: "fast"      → Faster, cheaper, for development/testing
report_quality:
  mode: "balanced"
  
  fast:
    max_evidence_chars_per_section: 1000
    max_tool_results_per_section: 10
    max_chars_per_rag_chunk: 300
    max_rag_chunks_per_section: 5
    max_summary_chars_for_sections: 300
    max_llm_output_tokens: 1024

  balanced:
    max_evidence_chars_per_section: 2000
    max_tool_results_per_section: 15
    max_chars_per_rag_chunk: 600
    max_rag_chunks_per_section: 8
    max_summary_chars_for_sections: 500
    max_llm_output_tokens: 2048

  quality:
    max_evidence_chars_per_section: 4000
    max_tool_results_per_section: 20
    max_chars_per_rag_chunk: 1000
    max_rag_chunks_per_section: 10
    max_summary_chars_for_sections: 800
    max_llm_output_tokens: 4096

# =====================================
# MONITORING & LOGGING
# =====================================
monitoring:
  langsmith:
    api_key: ${LANGCHAIN_API_KEY}
    project: ${PROJECT_NAME}
    tracing: ${LANGCHAIN_TRACING_V2}

# =====================================
# WORKFLOW CONFIGURATION
# =====================================
workflow:
  approval_mode: manual  # Options: auto(Production), manual(Demo), always_approve(Testing)

      # Overwrite from CLI:
        # python -m src.workflow.research_orchestrator --approval auto
        # python -m src.workflow.research_orchestrator --approval manual
        # python -m src.workflow.research_orchestrator --approval always_approve
# -----------------------------------------------------------------------------------------------------------

# =====================================
# RAG CONFIGURATION STARTS HERE
# =====================================

# =====================================
# RAG COMPLIANCE CONFIGURATION
# =====================================
rag_compliance:
  max_chunks: 8                   # Maximum chunks for compliance summary
  min_score_threshold: 0.4         # Minimum score to include chunk
  max_chunk_text_length: 400       # Max characters per chunk
  sort_by_score: true              # Sort by relevance


# =====================================
# RAG: PREPROCESSING / INGESTION
# =====================================
rag_preprocessing:
  lowercase: true
  strip_whitespace: true
  normalize_spaces: true
  remove_special_chars: false
  remove_numeric: false

  supported_exts:
    - ".pdf"
    - ".docx"
    - ".txt"

  loader_map:
    .pdf: langchain_community.document_loaders.PyPDFLoader
    .docx: langchain_community.document_loaders.Docx2txtLoader
    .txt: langchain_community.document_loaders.TextLoader

# =====================================
# RAG: TEXT SPLITTING STRATEGIES
# =====================================
rag_splitting:
  default_strategy: recursive_character

  # ==========================================
  # PYTHON-PRACTICAL MARKDOWN SPLITTERS
  # ==========================================

  markdown_language_splitter:
    import_path: langchain_text_splitters.RecursiveCharacterTextSplitter
    chunk_size: 512
    chunk_overlap: 100
    separators: ["\n#{1,6} ", "\n```\n", "\n\\*\\*\\*\n", "\n---\n", "\n___\n", "\n\n", "\n", " ", ""]
    is_separator_regex: true
    description: "LangChain's language-aware MARKDOWN splitter - respects headers, lists, sections [citation:7]"

  markdown_text_splitter:
    import_path: langchain_text_splitters.MarkdownTextSplitter
    chunk_size: 512
    chunk_overlap: 50
    separators: ["\n#{1,6} ", "\n```\n", "\n\\*\\*\\*\n", "\n---\n", "\n___\n", "\n\n", "\n", " ", ""]
    is_separator_regex: true
    description: "MarkdownTextSplitter - splits along markdown headings and code blocks [citation:3]"

  # ==========================================
  # SIMPLE HEADER-BASED SPLITTERS
  # ==========================================

  markdown_header:
    import_path: langchain_text_splitters.MarkdownHeaderTextSplitter
    headers_to_split_on:
      - ["#", "h1"]
      - ["##", "h2"]
      - ["###", "h3"]
      - ["####", "h4"]
    strip_headers: false
    description: "Splits at markdown headings - NO size control. Use as pipeline with recursive"

  # ==========================================
  # SIZE-CONTROL SPLITTERS (use after header split)
  # ==========================================

  recursive_character:
    import_path: langchain_text_splitters.RecursiveCharacterTextSplitter
    chunk_size: 512
    chunk_overlap: 50
    separators: ["\n\n", "\n", ". ", " ", ""]
    description: "Standard recursive splitter - use after header split for size control"

# =====================================
# RAG: EMBEDDING MODELS
# =====================================
rag_embeddings:
  default: openai
  
  huggingface:
    model_name: sentence-transformers/all-MiniLM-L6-v2
    dimensions: 384
    import_path: langchain_huggingface.HuggingFaceEmbeddings
    api_key: ${HUGGINGFACEHUB_API_TOKEN}

  openai:
    model_name: text-embedding-3-small
    dimensions: 1536
    import_path: langchain_openai.OpenAIEmbeddings
    api_key: ${OPENAI_API_KEY}

  google:
    model_name: models/embedding-001
    dimensions: 768
    import_path: langchain_google_genai.GoogleGenerativeAIEmbeddings
    api_key: ${GOOGLE_API_KEY}

# =====================================
# RAG: VECTOR STORES
# =====================================
rag_vectorstores:
  default: qdrant
  
  qdrant:
    import_path: langchain_qdrant.QdrantVectorStore
    url: ${QDRANT_URL}
    api_key: ${QDRANT_API_KEY}
    collection_name: restaurant_compliance-rag
  
  faiss:
    import_path: langchain_community.vectorstores.FAISS
    persist_directory: data/faiss_store
  
  chroma:
    import_path: langchain_community.vectorstores.Chroma
    persist_directory: data/chroma_store

# =====================================
# RAG: RETRIEVAL CONFIGURATION
# =====================================
rag_retrieval:
  top_k: 5
  score_threshold: 0.0
  jurisdiction_priority: false

# =====================================
# RAG: DOCUMENT SOURCES
# =====================================
rag_documents:
  data_path: data/raw
  supported_states:
    - Maharashtra
    - Karnataka
    - Delhi
    - Tamil Nadu
    - Gujarat
    - West Bengal
    - Telangana


# =====================================
# RAG: ERROR HANDLING & RETRIES
# =====================================
rag_retries:
  max_attempts: 3
  backoff_factor: 2

# =====================================
# RAG: MASTER SWITCH & SELECTIONS
# =====================================
rag:
  enabled: true
  
  # Which components to use (references above sections)
  splitting_strategy: recursive_character
  vectorstore: qdrant
  embedding_model: openai
  
  # Logging
  log_retrieval: true
  log_embeddings: false

# -----------------------------------------------------------------------------------------------------------

# =====================================
# EVALUATION
# =====================================
evaluation:

  enabled: true

  evaluators:

    workflow:
      enabled: true
      provider: langsmith
      import_path: src.evaluation.evaluators.workflow_evaluator.WorkflowEvaluator

      thresholds:
        execution_time_seconds: 10
        completed_nodes: 7
        failed_nodes: 0

    llm:
      enabled: false
      provider: langsmith
      import_path: src.evaluation.evaluators.llm_evaluator.LLMEvaluator

      thresholds:
        max_calls: 10
        max_total_tokens: 15000
        max_prompt_tokens: 8000
        max_completion_tokens: 7000
        max_cost_usd: 0.20
        max_latency_seconds: 60

    tools:
      enabled: false
      provider: custom
      import_path: src.evaluation.evaluators.tool_evaluator.ToolEvaluator

      thresholds:
        max_tool_latency_seconds: 5
        max_failed_tools: 0
        min_success_rate: 0.95

    report_quality:
      enabled: true
      provider: langsmith
      import_path: src.evaluation.evaluators.report_quality_evaluator.ReportQualityEvaluator

      criteria:
        - completeness
        - structure
        - evidence
        - recommendations
        - readability