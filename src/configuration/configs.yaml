# src/configuration/configs.yaml

apis:
  tavily:
    api_key: ${TAVILY_API_KEY}
    max_results: 5

  serpapi:
    api_key: ${SERPAPI_API_KEY}
    endpoint: ${SERPAPI_ENDPOINT}
    timeout: ${SERPAPI_TIMEOUT}

business_case:
  default:
    restaurant_concept: "Italian Restaurant"
    location:
      society: "karishma society"
      local_area: "kothrud"
      city: "Pune"
      state: "Maharashtra"
      country: "India"
      pincode: "411038"
    investment: "₹350,000"
    target_demographic: "Professionals 25-45, health-conscious"
    special_note: "demand, spending power, competition density"

research:
  sections:
    market_analysis:
      enabled: true
      title: Market Analysis
      tools:
        - google_trends
        - tavily_search
      queries:
        google_trends:
          - "{restaurant_concept}"
        tavily_search:
          - "{restaurant_concept} market demand trends {city} India"
          - "{restaurant_concept} consumer preferences dining trends {city} India"
          - "restaurant food delivery market trends {city} India"

    competitive_analysis:
      enabled: true
      title: Competitive Analysis
      tools:
        - google_maps
        - tavily_search
      queries:
        google_maps:
          - "{restaurant_concept} in {local_area}, {city}"
        tavily_search:
          - "{restaurant_concept} competitors {local_area} {city} pricing menu"
          - "{restaurant_concept} competitors market positioning {local_area} {city}"

    location_analysis:
      enabled: true
      title: Location Analysis
      tools:
        - google_maps
        - tavily_search
      queries:
        google_maps:
          - "colleges offices shopping centers in {local_area}, {city}"
          - "Corporate companies commercial hubs in {local_area}, {city}"
        tavily_search:
          - "{local_area} {city} commercial residential development"
          - "{local_area} {city} connectivity parking public transport"
          - "{local_area} {city} footfall traffic"

    customer_demographics:
      enabled: true
      title: Customer Demographics
      tools:
        - tavily_search
      queries:
        tavily_search:
          - "{local_area} {city} population, income and demographics"
          - "{local_area} {city} consumer spending dining habits food preferences"

    compliance_requirements:
      enabled: true
      title: Compliance Requirements
      tools:
        - rag
      queries:
        rag:
          - "FSSAI registration and license requirements for restaurants"
          - "FSSAI food business operator obligations and penalties"
          - "Maharashtra Shops and Establishments registration and working hours"
          - "Maharashtra restaurant municipal trade license and Fire NOC"
          - "restaurant eating house and music license requirements India"

report:
  sections:
    market_report:
      enabled: true
      title: Market Analysis Report
      prompt: market_analysis_prompt
      research_section: market_analysis
      dependencies: []

    competitive_report:
      enabled: true
      title: Competitive Analysis Report
      prompt: competitive_analysis_prompt
      research_section: competitive_analysis
      dependencies: []

    location_report:
      enabled: true
      title: Location Analysis Report
      prompt: location_analysis_prompt
      research_section: location_analysis
      dependencies: []

    demographics_report:
      enabled: true
      title: Customer Demographics Report
      prompt: customer_demographics_prompt
      research_section: customer_demographics
      dependencies: []

    compliance_report:
      enabled: true
      title: Compliance Requirements Report
      prompt: compliance_requirements_prompt
      research_section: compliance_requirements
      dependencies: []

    risk_assessment:
      enabled: true
      title: Risk Assessment
      prompt: risk_assessment_prompt
      research_section: null
      dependencies:
        - market_report
        - competitive_report
        - location_report
        - demographics_report
        - compliance_report

    strategic_recommendations:
      enabled: true
      title: Strategic Recommendations
      prompt: strategic_recommendations_prompt
      research_section: null
      dependencies:
        - risk_assessment

defaults:
  analysis_llm: openai

models:
  llms:
    groq:
      model_name: openai/gpt-oss-20b
      import_path: langchain_groq.ChatGroq
      api_key: ${GROQ_API_KEY}
      temperature: 0.3
      max_tokens: 1024

    openai:
      model_name: gpt-4o-mini
      import_path: langchain_openai.ChatOpenAI
      api_key: ${OPENAI_API_KEY}
      temperature: 0.3
      max_tokens: 1024

resource_limits:
  mode: quality

  fast:
    max_evidence_chars_per_section: 2000
    max_tool_results_per_section: 10
    max_text_per_result: 300
    max_summary_chars_for_sections: 500
    max_evidence_chars_for_final_report: 6000

  balanced:
    max_evidence_chars_per_section: 3000
    max_tool_results_per_section: 12
    max_text_per_result: 400
    max_summary_chars_for_sections: 600
    max_evidence_chars_for_final_report: 8000

  quality:
    max_evidence_chars_per_section: 6000
    max_tool_results_per_section: 15
    max_text_per_result: 300
    max_summary_chars_for_sections: 800
    max_evidence_chars_for_final_report: 10000

reporting:
  retry:
    max_retries: 3
    backoff_seconds: 1.0

rag_splitting:
  default_strategy: recursive_character
  recursive_character:
    chunk_size: 1024
    chunk_overlap: 100
    separators:
      - "\n\n"
      - "\n"
      - ". "
      - " "
      - ""

rag_embeddings:
  default: openai
  openai:
    model_name: text-embedding-3-small
    dimensions: 1536
    import_path: langchain_openai.OpenAIEmbeddings
    api_key: ${OPENAI_API_KEY}

rag_vectorstores:
  default: qdrant
  qdrant:
    url: ${QDRANT_URL}
    api_key: ${QDRANT_API_KEY}
    collection_name: restaurant_compliance-rag

rag_retrieval:
  top_k: 4
  score_threshold: 0.3
  max_chars_per_chunk: 500

rag_sources:
  local_pdfs:
    - path: "data/raw/base_docs/Legal_&_Regulatory_Handbook_for_Restaurants_and_Cafés.pdf"
      title: "Legal & Regulatory Handbook for Restaurants and Cafés"
      description: "Comprehensive compliance guide for restaurants in India"
  websites:
    - url: "https://www.indiafilings.com/learn/maharashtra-shops-and-establishment-act"
      title: "Maharashtra Shops and Establishment Act"
      description: "Regulations for shops and establishments in Maharashtra"
  online_pdfs:
    - url: "https://fssai.gov.in/docs/food-law/act-2006/Food_Safety_and_Standards_Act_2006.pdf"
      title: "Food Safety and Standards Act, 2006"
      description: "Primary food safety legislation for India"